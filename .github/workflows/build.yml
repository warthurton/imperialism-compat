name: Build and check

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch pinned sources and toolchain
        # Downloads retry transient connection/HTTP failures; checksum errors fail immediately.
        run: python -I tools/fetch_deps.py --toolchain
      - name: Check download failure handling
        run: python -I tools/test_fetch.py
      - name: Build display shim
        run: python -I build.py
      - name: Check display ABI and native behavior
        run: python -I tools/test_display.py
      - name: Build both music variants
        run: python -I tools/build_music.py
      - name: Check music ABI and generated-tone metadata
        run: python -I tools/test_music.py
      - name: Package and verify release contents
        run: python -I tools/test_package.py
      - name: Display artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: display
          path: dist/*-display-*.zip
          if-no-files-found: error
      - name: Music artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: music
          path: |
            dist/*-music-*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

  draft-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Create draft for maintainer review
        run: python -I tools/release.py
        env:
          GH_TOKEN: ${{ github.token }}
