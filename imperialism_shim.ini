[display]
; Keep the desktop resolution; scale the game's view in a separate window.
block_mode_change=1
; Use whole-number scaling in fullscreen when the display is large enough.
fullscreen_integer_scale=1
; Match the title bar to the backdrop on supported Windows 11 versions.
brown_titlebar=1
; Tile the running game's own backdrop bitmap when available; otherwise use plain brown.
original_backdrop=1

[text_log]
; Diagnostic capture of strings drawn by the game. Disabled for normal play.
enabled=0

[test_hook]
; For test harnesses only. 1 = the mirror window accepts the private message WM_APP+0x40, whose lParam is a click position in the
; game's own pixels; the shim then clicks there like a real mouse (no focus needed, works on modal pop-ups). 0 for normal play.
enabled=0
